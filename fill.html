<script>
(function(){
  function addHome(){
    if(document.getElementById('home-to-index')) return;
    // trova il contenitore gap-2.5 esistente
    let gap = null;
    document.querySelectorAll('header div').forEach(function(d){
      if(d.className && d.className.includes('gap-2.5') && d.textContent.includes('8453')){
        gap = d;
      }
    });
    if(!gap){
      // fallback: cerca header e prendi l'ultimo flex a destra
      let header = document.querySelector('header');
      if(header){
        let divs = header.querySelectorAll('div.flex.items-center.gap-2\.5');
        if(divs.length) gap = divs[divs.length-1];
      }
    }
    if(!gap) return;
    let a = document.createElement('a');
    a.id='home-to-index';
    a.href='./index.html';
    a.title='Home';
    a.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>';
    a.style.cssText='width:38px;height:38px;border-radius:9999px;background:#113976;border:1px solid #113976;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;margin-left:4px;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
    gap.appendChild(a);
  }
  document.addEventListener('DOMContentLoaded', addHome);
  let t=setInterval(function(){ addHome(); }, 800);
  setTimeout(function(){ clearInterval(t); }, 10000);
})();
</script>
