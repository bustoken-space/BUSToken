<script>
(function(){
  function ensureTradeAndJoin(){
    const headers = document.querySelectorAll('header, nav');
    const header = headers[0];
    if(!header) return;
    // Trade
    let trade = document.querySelector('a[href="./trade.html"]');
    if(!trade){
      trade = document.createElement('a');
      trade.href='./trade.html';
      trade.textContent='🚀 Trade';
      trade.style.cssText='display:inline-flex;align-items:center;gap:6px;background:#00ff88;color:#000;padding:7px 16px;border-radius:9999px;font-weight:900;font-size:13px;text-decoration:none;margin-left:10px;';
      const bustEl = Array.from(document.querySelectorAll('*')).find(el=>el.textContent && el.textContent.trim()==='$BUST');
      if(bustEl && bustEl.parentElement){
        bustEl.parentElement.appendChild(trade);
      } else {
        header.appendChild(trade);
      }
    }
    // Join Scap Labs - vicino Trade
    let join = document.getElementById('join-scap-labs-btn');
    if(!join){
      join = document.createElement('a');
      join.id='join-scap-labs-btn';
      join.href='./fill.html';
      join.textContent='Join Scap Labs';
      join.style.cssText='display:inline-flex;align-items:center;gap:6px;background:#0a0a0a;color:#00ff88;padding:7px 16px;border-radius:9999px;font-weight:900;font-size:13px;text-decoration:none;margin-left:8px;border:1px solid #00ff88;';
      if(trade && trade.parentElement){
        trade.parentElement.insertBefore(join, trade.nextSibling);
      } else {
        header.appendChild(join);
      }
    }
    // assicurati solo uno per tipo
    document.querySelectorAll('a[href="./trade.html"]').forEach((el,i)=>{ if(i>0) el.remove(); });
    document.querySelectorAll('#join-scap-labs-btn').forEach((el,i)=>{ if(i>0) el.remove(); });
  }
  document.addEventListener('DOMContentLoaded', ensureTradeAndJoin);
  setTimeout(ensureTradeAndJoin, 400);
  setTimeout(ensureTradeAndJoin, 1200);
  setTimeout(ensureTradeAndJoin, 2500);
})();
</script>
